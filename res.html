<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      .hero-section{
padding:120px 0;
background:#f5f5f5;
}

.hero-text h1{
font-size:55px;
font-weight:700;
}

.hero-text span{
color:#ff6a00;
}

.hero-img img{
max-width:420px;
border-radius:50%;
background:#ff6a00;
padding:30px;
}

/* Tablet */
@media (max-width:991px){

.hero-text{
text-align:center;
margin-bottom:40px;
}

.hero-text h1{
font-size:40px;
}

.hero-img img{
max-width:300px;
}

}

/* Mobile */
@media (max-width:576px){

.hero-text h1{
font-size:32px;
}

.hero-img img{
max-width:250px;
}

}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pricing</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<section class="hero-section">
  <div class="container">
    <div class="row align-items-center">

      <!-- Text -->
      <div class="col-lg-6 col-md-12 hero-text">
        <h1>
          All-time <br>
          <span>High Rated</span><br>
          Recipes
        </h1>

        <p>
          We source sustainable & line caught seafood,
          as well as live crustaceans everyday.
        </p>
      </div>

      <!-- Image -->
      <div class="col-lg-6 col-md-12 text-center hero-img">
        <img src="girl_food.png" class="img-fluid">
      </div>

    </div>
  </div>
</section>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
